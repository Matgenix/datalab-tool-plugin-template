name: Template

on:
  pull_request:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kind: [standalone, in-app]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.x"
      - name: Generate project
        run: |
          uvx copier copy --trust --defaults \
            --data tool_ui_kind=${{ matrix.kind }} \
            --data tool_name="Generated ${{ matrix.kind }}" \
            --data distribution_name="datalab-generated-${{ matrix.kind }}-tool" \
            --data repository_name="datalab-generated-${{ matrix.kind }}-tool" \
            --data tool_id="generated-${{ matrix.kind }}" \
            --data add_item_table_action=true \
            . generated
      - uses: actions/setup-node@v6
        if: matrix.kind == 'in-app'
        with:
          node-version: "22"
      - name: Build in-app frontend
        if: matrix.kind == 'in-app'
        working-directory: generated/frontend
        run: |
          corepack enable
          yarn install
          yarn lint
          yarn build
      - name: Lock and test Python project
        working-directory: generated
        run: |
          uv lock
          uv sync --locked --all-extras --dev
          uv run pre-commit run --all-files --show-diff-on-failure
          uv run pytest -v
          uv run mkdocs build --strict
          uv build
      - name: Assert topology-specific render
        working-directory: generated
        run: |
          if [ "${{ matrix.kind }}" = standalone ]; then
            test -f Dockerfile
            test -f src/datalab_generated_standalone_tool/service.py
            test -f src/datalab_generated_standalone_tool/config.py
            test ! -e src/datalab_generated_standalone_tool/static/index.html
          else
            test ! -e Dockerfile
            test ! -e src/datalab_generated_in_app_tool/service.py
            test ! -e src/datalab_generated_in_app_tool/config.py
            test ! -e .env.example
          fi
      - name: Verify clean service-only installation
        if: matrix.kind == 'standalone'
        working-directory: generated
        run: |
          python -m venv /tmp/generated-service
          wheel=$(find dist -name '*.whl' -print -quit)
          /tmp/generated-service/bin/pip install "${wheel}[service]"
          /tmp/generated-service/bin/python -c "import datalab_generated_standalone_tool; from datalab_generated_standalone_tool.service import create_app; assert 'pydatalab' not in __import__('sys').modules"
      - name: Build and health-check external image
        if: matrix.kind == 'standalone'
        working-directory: generated
        run: |
          docker build -t datalab-generated-standalone:test .
          docker run -d --name generated-standalone -p 127.0.0.1:18000:8000 \
            -e DATALAB_GENERATED_STANDALONE_PUBLIC_URL=http://127.0.0.1:18000 \
            -e DATALAB_GENERATED_STANDALONE_DATALAB_BROWSER_API_URL=http://127.0.0.1:5001 \
            -e DATALAB_GENERATED_STANDALONE_DATALAB_API_URL=http://127.0.0.1:5001 \
            -e DATALAB_GENERATED_STANDALONE_CLIENT_SECRET=cccccccccccccccccccccccccccccccc \
            -e DATALAB_GENERATED_STANDALONE_COOKIE_SECRET=kkkkkkkkkkkkkkkkkkkkkkkkkkkkkkkk \
            datalab-generated-standalone:test
          trap 'docker rm -f generated-standalone' EXIT
          for attempt in $(seq 1 20); do curl --fail http://127.0.0.1:18000/healthz && break; sleep 1; done
          curl --fail http://127.0.0.1:18000/healthz
